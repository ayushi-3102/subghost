name: SubGhost Mobile Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias subghost -keyalg RSA -keysize 2048 -validity 10000 -storepass subghostpass -keypass subghostpass -dname "CN=SubGhost, OU=SubGhost, O=SubGhost, L=City, S=State, C=US"

      - name: Build Android App Bundle (.aab for Google Play)
        run: flutter build appbundle --release

      - name: Build Android APK (Direct Install)
        run: flutter build apk --release

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subghost-android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS Archive
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Simulator (for Appetize.io Browser Testing)
        run: |
          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r SubGhost-iOS-Simulator.zip Runner.app

      - name: Upload iOS Simulator (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: SubGhost-iOS-Simulator
          path: build/ios/iphonesimulator/SubGhost-iOS-Simulator.zip
